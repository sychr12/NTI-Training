spring.docker.compose.enabled=false
spring.datasource.url=${NTI_TEST_DATABASE_URL:jdbc:h2:mem:nti_training;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=${NTI_TEST_DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${NTI_TEST_DATABASE_USER:sa}
spring.datasource.password=${NTI_TEST_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.session.jdbc.initialize-schema=always

debug=false
logging.level.root=WARN
