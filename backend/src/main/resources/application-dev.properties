# Perfil para desenvolver fora da rede do AD: usuario local e PostgreSQL via Docker (compose.yaml).
# Nunca use em producao.
nti.auth.dev.username=${NTI_DEV_USERNAME:dev}
nti.auth.dev.password=${NTI_DEV_PASSWORD:dev123}
nti.auth.dev.nome=Dev Local
nti.auth.dev.email=dev@localhost

spring.docker.compose.enabled=true

# Conteudo de exemplo (tutoriais, trilhas, dicas, glossario e exercicios) para desenvolver com dados.
spring.sql.init.data-locations=classpath:data-dev.sql
spring.sql.init.encoding=UTF-8
