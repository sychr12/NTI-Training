spring.application.name=backend
spring.session.jdbc.initialize-schema=always
spring.sql.init.mode=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NTI_SESSION_COOKIE_SECURE:false}

nti.auth.cors.allowed-origins=${NTI_CORS_ALLOWED_ORIGINS:http://localhost:3000}
nti.auth.session.default-timeout-seconds=${NTI_SESSION_DEFAULT_TIMEOUT_SECONDS:28800}
nti.auth.session.remember-timeout-seconds=${NTI_SESSION_REMEMBER_TIMEOUT_SECONDS:2592000}
nti.auth.ad.url=${NTI_AD_URL:}
nti.auth.ad.base-dn=${NTI_AD_BASE_DN:}
nti.auth.ad.service-user-dn=${NTI_AD_SERVICE_USER_DN:}
nti.auth.ad.service-password=${NTI_AD_SERVICE_PASSWORD:}
nti.auth.ad.user-search-filter=${NTI_AD_USER_SEARCH_FILTER:(sAMAccountName={0})}
nti.auth.ad.required-group-dn=${NTI_AD_REQUIRED_GROUP_DN:}
