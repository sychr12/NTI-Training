spring.application.name=backend

# PostgreSQL externo: configure estas variaveis no ambiente ou na IDE.
spring.docker.compose.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.session.jdbc.initialize-schema=always
spring.sql.init.mode=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NTI_SESSION_COOKIE_SECURE:false}

nti.auth.cors.allowed-origins=${NTI_CORS_ALLOWED_ORIGINS:http://localhost:3000}
nti.auth.session.default-timeout-seconds=${NTI_SESSION_DEFAULT_TIMEOUT_SECONDS:28800}
nti.auth.session.remember-timeout-seconds=${NTI_SESSION_REMEMBER_TIMEOUT_SECONDS:2592000}
# Temporario: o AD atual responde em LDAP/389, sem TLS. Migre para LDAPS/636 assim que o servidor for corrigido.
nti.auth.ad.url=${NTI_AD_URL:ldap://10.46.1.2:389}
nti.auth.ad.domain=${NTI_AD_DOMAIN:idam.am.gov.br}
nti.auth.ad.base-dn=${NTI_AD_BASE_DN:DC=idam,DC=am,DC=gov,DC=br}
nti.auth.ad.user-search-filter=${NTI_AD_USER_SEARCH_FILTER:(&(objectCategory=person)(objectClass=user)(sAMAccountName={0}))}
nti.auth.ad.allowed-groups=${NTI_AD_ALLOWED_GROUPS:GTI,GTI_ESTAGIARIO}
nti.auth.ad.allow-insecure-ldap=${NTI_AD_ALLOW_INSECURE_LDAP:false}
